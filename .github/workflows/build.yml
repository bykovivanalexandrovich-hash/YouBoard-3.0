name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          best=""
          bt=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            t=${t:-0}
            if [ "$t" -ge "$bt" ]; then
              bt=$t
              best="$f"
            fi
          done < <(find . -type f -iname 'MaterialYouKeyboard*.zip' -not -path './.git/*')
          echo "Using: $best"
          test -n "$best"
          unzip -qo "$best"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        run: gradle assembleDebug --no-daemon
        working-directory: MaterialYouKeyboard
      - uses: actions/upload-artifact@v4
        with:
          name: YouBoard
          path: MaterialYouKeyboard/app/build/outputs/apk/debug/YouBoard.apk
